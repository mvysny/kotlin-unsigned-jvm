name: Gradle

on: [push, pull_request]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21, 24]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        # intentionally no `cache:` — setup-gradle below handles Gradle caching
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle
      # no --info/--stacktrace: the Test task already prints full failure traces (exceptionFormat = FULL)
      run: ./gradlew clean build --no-daemon --no-watch-fs

  # The doc layer (design/) is checked once, on Linux — the scripts are bash and OS-independent.
  tripwires:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Verify design docs and project invariants
      run: |
        design/verify_design_tripwires.sh
        design/verify_project_tripwires.sh
