name: Gradle

on: [push, pull_request]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21, 24]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
    - name: Build with Gradle
      run: ./gradlew clean build --stacktrace --info --no-daemon

  # The doc layer (design/) is checked once, on Linux — the scripts are bash and OS-independent.
  tripwires:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Verify design docs and project invariants
      run: |
        design/verify_design_tripwires.sh
        design/verify_project_tripwires.sh

